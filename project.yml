name: PadTerm

options:
  bundleIdPrefix: com.padterm
  deploymentTarget:
    iOS: "17.0"
  groupSortPosition: top
  createIntermediateGroups: true

packages:
  NIOSSH:
    url: https://github.com/apple/swift-nio-ssh.git
    from: "0.9.1"
  NIO:
    url: https://github.com/apple/swift-nio.git
    from: "2.99.0"

targets:
  AuthProbe:
    type: tool
    platform: macOS
    sources:
      - path: .probe/Sources/AuthProbe
    dependencies:
      - package: NIOSSH
      - package: NIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padterm.authprobe
        SWIFT_VERSION: "5.0"
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        SWIFT_STRICT_CONCURRENCY: minimal
  PadTermTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PadTermTests
      - path: PadTerm/Terminal
        excludes:
          - "**/TerminalRenderView.swift"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padterm.PadTermTests
        SWIFT_VERSION: "5.0"
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        TEST_HOST: ""
        BUNDLE_LOADER: ""
  PadTerm:
    type: application
    platform: iOS
    sources:
      - path: PadTerm
        excludes:
          - "**/*.md"
      - path: PadTerm/Resources/mermaid.min.js
        buildPhase: resources
    dependencies:
      - package: NIOSSH
      - package: NIO
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.padterm.PadTerm
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        INFOPLIST_KEY_NSHumanReadableCopyright: "Copyright © 2026 杨源鑫 (Bruce.yang) · All rights reserved"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: PadTerm/Info.plist
      properties:
        CFBundleDisplayName: PadTerm
        CFBundleName: PadTerm
        NSHumanReadableCopyright: "Copyright © 2026 杨源鑫 (Bruce.yang) · All rights reserved · Licensed under GPL-3.0"
        LSApplicationCategoryType: public.app-category.developer-tools
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UIApplicationSupportsIndirectInputEvents: true
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: PadTerm 需要通过 SSH 连接同一局域网内的 3D 打印机与 Linux 设备
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIFileSharingEnabled: true
        CFBundleSupportedPresentations:
          - UIModalPresentationAutomatic
      attributes:
        CFBundleDevelopmentRegion: zh_CN
